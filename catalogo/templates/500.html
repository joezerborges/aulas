{% extends "catalogo/base.html" %}

{% block title %}Erro no servidor | Página de Papel{% endblock %}

{% block content %}
<section class="card border-0 shadow-sm text-center p-4 p-md-5" aria-labelledby="erro-titulo">
    <div class="card-body">
        <p class="display-1 fw-bold text-danger mb-0">500</p>
        <h1 id="erro-titulo" class="h2 mt-3">Algo deu errado por aqui</h1>
        <p class="text-secondary mt-3">
            O servidor encontrou um problema inesperado. Tente novamente mais tarde.
        </p>
        <a class="btn btn-primary mt-3" href="/">Voltar ao início</a>
    </div>
</section>
{% endblock %}
