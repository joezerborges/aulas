<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Administração</title>
  <!-- CSS completo do Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
</head>
<body class="bg-light">

  <div class="container">
    <div class="row justify-content-center align-items-center vh-100">
      <div class="col-12 col-sm-8 col-md-6 col-lg-4">
        
        <div class="card shadow-sm border-0 rounded-3">
          <div class="card-body p-4 p-md-5">
            <h3 class="text-center mb-4 fw-bold">Entrar</h3>

            <!-- Exibe mensagens de erro caso usuário ou senha estejam incorretos -->
            {% if form.errors %}
              <div class="alert alert-danger py-2 small" role="alert">
                Usuário ou senha inválidos. Tente novamente.
              </div>
            {% endif %}
            
            <form action="{{ app_path }}" method="post">
              {% csrf_token %}

              <!-- Campo de Usuário (aceita username ou e-mail) -->
              <div class="form-floating mb-3">
                <input type="text" name="username" class="form-control" id="usernameInput" placeholder="Usuário" required autofocus>
                <label for="usernameInput">Usuário ou e-mail</label>
              </div>

              <!-- Campo de Senha -->
              <div class="form-floating mb-3">
                <input type="password" name="password" class="form-control" id="passwordInput" placeholder="Senha" required>
                <label for="passwordInput">Senha</label>
              </div>

              <!-- Campo oculto exigido pelo Django para redirecionamento -->
              <input type="hidden" name="next" value="{{ next }}">

              <!-- Botão de Envio -->
              <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary btn-lg">Acessar</button>
              </div>
            </form>

          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- JS completo do Bootstrap 5 -->
  <script src="https://jsdelivr.net"></script>
</body>
</html>
